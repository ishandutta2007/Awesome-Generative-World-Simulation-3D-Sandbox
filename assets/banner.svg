<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-16px) scale(1.04); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.75; stroke-dashoffset: -40; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
      }
      .anim-float1 { animation: floatSlow 8s ease-in-out infinite; }
      .anim-float2 { animation: floatSlow 10s ease-in-out infinite 2s; }
      .anim-pulse { animation: pulseBeam 5s linear infinite; }
      .orbit-particle { animation: orbit 12s linear infinite; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (in background) -->
  <circle cx="200" cy="120" r="140" fill="url(#glowGrad1)" class="anim-float1" />
  <circle cx="1020" cy="280" r="160" fill="url(#glowGrad2)" class="anim-float2" />

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Isometric 3D Sandbox Voxels (Abstract) -->
  <g opacity="0.3" transform="translate(930, 70) scale(0.95)">
    <!-- 3D Voxel Cube 1 -->
    <path d="M 60 20 L 110 50 L 60 80 L 10 50 Z" fill="#38bdf8" fill-opacity="0.8" />
    <path d="M 10 50 L 60 80 L 60 140 L 10 110 Z" fill="#0284c7" fill-opacity="0.8" />
    <path d="M 60 80 L 110 50 L 110 110 L 60 140 Z" fill="#0369a1" fill-opacity="0.8" />

    <!-- 3D Voxel Cube 2 -->
    <path d="M 130 60 L 180 90 L 130 120 L 80 90 Z" fill="#c084fc" fill-opacity="0.8" />
    <path d="M 80 90 L 130 120 L 130 180 L 80 150 Z" fill="#9333ea" fill-opacity="0.8" />
    <path d="M 130 120 L 180 90 L 180 150 L 130 180 Z" fill="#7e22ce" fill-opacity="0.8" />

    <!-- 3D Voxel Cube 3 -->
    <path d="M 180 140 L 230 170 L 180 200 L 130 170 Z" fill="#f472b6" fill-opacity="0.8" />
    <path d="M 130 170 L 180 200 L 180 260 L 130 230 Z" fill="#db2777" fill-opacity="0.8" />
    <path d="M 180 200 L 230 170 L 230 230 L 180 260 Z" fill="#be185d" fill-opacity="0.8" />

    <!-- Circuit/Neural connecting rays -->
    <path d="M 60 80 L 130 120 M 130 120 L 180 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" class="anim-pulse" />
  </g>

  <!-- Left Side Geometric Spatial Coordinate Nodes (Dynamic Background) -->
  <g opacity="0.35" transform="translate(60, 50)">
    <circle cx="50" cy="50" r="4" fill="#38bdf8" />
    <circle cx="120" cy="90" r="3" fill="#818cf8" />
    <circle cx="40" cy="160" r="4" fill="#c084fc" />
    <circle cx="110" cy="220" r="5" fill="#f472b6" />
    <path d="M 50 50 L 120 90 L 40 160 L 110 220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="50" cy="50" r="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="370" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="32" y="21" fill="#bae6fd" class="badge-text">⚡ CURATED AWESOME RESEARCH &amp; DIRECTORY</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Subtitle -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" fill="url(#textGrad)" class="title-text" font-size="46" filter="url(#glow)">
      Generative World Simulation &amp; 3D Sandbox
    </text>
    <text x="0" y="44" fill="#f8fafc" class="subtitle-text" font-size="21">
      Interactive World Models • Open-Source Voxel Engines • Spatial Physics Simulators • UGC Worlds
    </text>
    <text x="0" y="80" fill="#94a3b8" class="subtitle-text" font-size="15">
      The authoritative reference directory for neural world generation, virtual sandboxes, and embodied AI environments.
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Feature Pills / Badges -->
  <g transform="translate(80, 275)">
    <!-- Pill 1: Neural World Models -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <text x="18" y="26" fill="#38bdf8" class="badge-text">🧠 Neural World Models</text>
    </g>

    <!-- Pill 2: Open-Source Voxel Sandboxes -->
    <g transform="translate(225, 0)">
      <rect width="220" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
      <text x="18" y="26" fill="#a5b4fc" class="badge-text">🧱 Open Voxel Sandboxes</text>
    </g>

    <!-- Pill 3: Embodied AI & Physics -->
    <g transform="translate(460, 0)">
      <rect width="210" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" />
      <text x="18" y="26" fill="#e9d5ff" class="badge-text">🤖 Embodied AI Physics</text>
    </g>

    <!-- Pill 4: Decentralized 3D Worlds -->
    <g transform="translate(685, 0)">
      <rect width="220" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#f472b6" stroke-width="1.2" />
      <text x="18" y="26" fill="#fbcfe8" class="badge-text">🌐 Social &amp; Spatial Worlds</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Bar -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" fill="#64748b" class="badge-text" font-size="13">
      ⭐ Real-time GitHub Star Badges  •  💰 Verified Commercial SaaS Pricing  •  🆓 Free Forever &amp; Trial Limits  •  ⚖️ Permissive Licenses
    </text>
  </g>
</svg>
